[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "{project_name}"
version = "0.1.0"
description = "{project_description}"
readme = "README.md"
requires-python = ">=3.9"
authors = [
{authors_block}
]
dependencies = [
]

[tool.setuptools.packages.find]
where = ["."]
include = ["weegit_add_ons*"]
namespaces = true

[project.entry-points."weegit.add_ons"]
{project_name} = "weegit_add_ons.{project_name}.entry_point:ExampleAddOn"
